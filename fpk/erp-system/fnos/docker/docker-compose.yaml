version: '3.8'

services:
  backend:
    image: ${DOCKER_MIRROR}docker.io/library/erp-backend:latest
    build:
      context: ../../../../erp
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=erp.settings
      - DB_ENGINE=django.db.backends.sqlite3
      - DB_NAME=/app/data/db.sqlite3
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-erp-production-secret-change-me}
      - ALLOWED_HOSTS=*
    volumes:
      - ${TRIM_PKGVAR:?}/data:/app/data
      - ${TRIM_PKGVAR:?}/media:/app/media
      - ${TRIM_PKGVAR:?}/logs:/app/logs
    networks:
      - erp-network

  frontend:
    image: ${DOCKER_MIRROR}docker.io/library/erp-frontend:latest
    build:
      context: ../../../../web
      dockerfile: Dockerfile
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - "${TRIM_SERVICE_PORT}:80"
    depends_on:
      - backend
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge
